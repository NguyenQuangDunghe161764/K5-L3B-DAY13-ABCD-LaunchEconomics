# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu, MDE 5 điểm: 1.251 yêu cầu/nhóm.
#   b) Theo nhân viên, m = 75: DE 2,48; 3.103 yêu cầu/nhóm, xấp xỉ 42 nhân viên/nhóm; tổng 84 > 40, không khả thi.
#   c) 20 nhân viên/nhóm: cận trên cỡ mẫu hiệu dụng 1.000 < 1.251, không đủ cho MDE 5 điểm.
#   d) 6 depot/nhóm: cận trên cỡ mẫu hiệu dụng 300, không đủ cho MDE 5 điểm.
#   e) Chấp nhận MDE 6 điểm: 859 yêu cầu hiệu dụng/nhóm; với 20 nhân viên/nhóm cần 299 yêu cầu/nhân viên (DE 6,96).
#      Nếu tác động thật chỉ là 5 điểm, power xấp xỉ 0,64. Cần 5.980 yêu cầu thô/nhóm; xác nhận tính khả thi trước khi chạy.
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Có: 20 nhân viên đối chứng chạy cùng tuần và depot.
#   2. Bốc thăm bằng code, ghi seed trước, phân tầng theo depot.
#   3. Có nguy cơ nhân viên chia sẻ câu trả lời; giới hạn quyền theo tài khoản và ghi log mở trợ lý theo staff_id.
#   4. Chốt trước khi chạy chỉ số chính, ngưỡng, luật dừng và ngày quyết định.
#   5. Có 20 cụm (nhân viên) mỗi nhóm.
#
# Đánh đổi: chia theo nhân viên để giảm tràn tác động; chấp nhận chỉ đủ power cho MDE 6 điểm, không phải 5 điểm.
#
# Tỉ lệ mở lại 7 ngày: 4,25% toàn bộ dữ liệu (51/1.200), 3,97% trong phạm vi pilot.
# Ngưỡng an toàn mẫu: chênh lệch với đối chứng ít nhất 2 điểm phần trăm hoặc trần tuyệt đối 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang tại các depot tham gia; phân tầng ngẫu nhiên theo depot. Loại quoc_te (22.515 đ/việc thành công, 1,88x thủ công) và doi_tac khỏi pilot."
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần; 4 -> 10 -> 20 nhân viên dùng trợ lý, đối chứng chạy đồng thời
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859                # cỡ mẫu hiệu dụng; không phải số yêu cầu thô
    design_effect: 6.96
    clusters_per_arm: 20
    requests_per_staff: 299
    raw_requests_per_arm: 5980
  identifiability:
    concurrent_control: "Có; 20 nhân viên đối chứng làm cùng tuần và depot với nhóm trợ lý."
    spillover_risk: "Nhân viên cùng depot có thể chia sẻ câu trả lời; giới hạn quyền trợ lý theo tài khoản và ghi log lượt mở theo staff_id."
    predeclared: "Trước khi chạy, khóa chỉ số chính, MDE 6 điểm, luật dừng, cách phân bổ và ngày quyết định 2027-01-05; lưu seed ngẫu nhiên."
  stop_rules:
    - "NẾU tỉ lệ mở lại 7 ngày trên các yêu cầu đã đủ 7 ngày theo dõi của nhóm trợ lý cao hơn đối chứng ít nhất 2 điểm phần trăm hoặc vượt 6% trong 3 lần kiểm tra hằng ngày liên tiếp, HOẶC phát hiện ít nhất 1 ca hoàn trùng trong bất kỳ cửa sổ 3 ngày nào THÌ Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ không được chuyển sang bước rollout tiếp theo."
    - "NẾU chi phí mỗi việc thành công trong phạm vi pilot vượt 8.000 đ trong 2 tuần liên tiếp THÌ Người quản lý sản phẩm thu hẹp phạm vi về noi_dia và giới hạn tối đa 2 lần chạy KHÔNG THÌ không được mở rộng hang_nang."
    - "NẾU tỉ lệ bỏ qua gợi ý (sửa hoặc bỏ / số yêu cầu được xem lại) vượt 40% trong 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày KHÔNG THÌ không được chuyển sang bước rollout tiếp theo."
  interim_looks: "Kiểm tra hằng ngày chỉ số an toàn trên các yêu cầu đã đủ 7 ngày theo dõi; không xem hiệu quả chính giữa kỳ."
  rollback: "Giám đốc vận hành kích hoạt cờ tắt; trợ lý ngừng trong 30 phút; khách được phục vụ bằng luồng nhân viên xử lý thủ công."
  decision_date: "2027-01-05"
  simulated_inputs:
    - "Thiết kế mẫu: baseline chính 0.70, MDE 0.06, alpha 0.05, power 0.80, ICC 0.02."
    - "Cỡ mẫu cụm: 20 nhân viên mỗi nhánh, DE 6.96, 859 yêu cầu hiệu dụng mỗi nhánh, 299 yêu cầu mỗi nhân viên (5.980 yêu cầu thô mỗi nhánh)."
    - "Rollout theo tuần: 10%, 25%, 50%; tối đa 20 nhân viên dùng trợ lý và 20 đối chứng."
    - "Ngưỡng kế hoạch: chênh lệch mở lại 2 điểm phần trăm, trần 6%, chi phí 8.000 đ, bỏ qua gợi ý 40%, rollback 30 phút."
    - "Ngày quyết định dự kiến: 2027-01-05."
